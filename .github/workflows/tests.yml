name: Run Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # 依赖见仓库根目录 requirements_test.txt（含测试框架 + lunar-python / home-assistant-frontend 等运行期依赖）
          pip install -r requirements_test.txt

      - name: Verify test plugins are importable
        run: python -c "import pytest_homeassistant_custom_component; print('pytest_homeassistant_custom_component import OK')"

      - name: Verify frontend dependency is importable
        run: python -c "import hass_frontend; print('hass_frontend import OK')"

      - name: Run pytest
        run: python -m pytest tests -v
